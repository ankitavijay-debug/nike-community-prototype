<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Nike Member Community – single-page prototype</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--aub:#3f0e40;--aub2:#350d36;--bd:#e0e0e0;--mut:#616061;--blue:#1264a3;--grn:#007a5a;--org:#fa5400;--txt:#1d1c1d}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif;color:var(--txt);height:100vh;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit}
.top{background:var(--aub2);color:#fff;display:flex;gap:10px;align-items:center;padding:7px 14px;font-size:12px;flex-wrap:wrap}
.top .s{flex:1;max-width:340px;margin:auto;background:#ffffff26;border-radius:6px;padding:4px 12px;color:#ffffffcc}
.me{background:#fff;color:var(--txt);border-radius:14px;padding:2px 10px;font-weight:600}
.app{flex:1;display:flex;min-height:0}
.rail{width:60px;background:var(--aub2);display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:12px;color:#fff;flex:none}
.rail i{font-style:normal;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:#ffffff1f}
.side{width:220px;background:var(--aub);color:#ffffffcc;padding:12px 0;flex:none;overflow:auto}
.side h4{margin:14px 16px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#fff9}
.side a{display:flex;justify-content:space-between;padding:4px 16px;cursor:pointer}.side a:hover{background:#ffffff14}.side a.on{background:var(--blue);color:#fff}
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 290px;min-width:0;overflow:hidden}
.col{overflow:auto;padding:16px 20px}.right{border-left:1px solid var(--bd);overflow:auto;padding:12px;background:#fafafa}
.hero{border-radius:10px;padding:16px;color:#fff;background:linear-gradient(110deg,#111,#444 60%,var(--org));margin-bottom:12px;text-align:center}
.card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px}
.btn{background:var(--pri,var(--grn));color:#fff;border:0;border-radius:6px;padding:5px 12px;font-weight:600;cursor:pointer}.btn.s{background:#fff;color:var(--txt);border:1px solid #bbb;font-weight:500}.btn.o{background:var(--org)}.btn.sm{padding:2px 9px;font-size:12px}.btn.bad{background:#b3123a}.btn:disabled{opacity:.5;cursor:default}
.meta{font-size:12px;color:var(--mut)}.tag{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;margin:0 4px 2px 0;background:#eef;color:#336}
.g{background:#e1f5ee;color:var(--grn)}.y{background:#fff4d6;color:#8a6100}.ai{background:#f3e8f7;color:#611f69}.r{background:#fde5ec;color:#b3123a}.b{background:#e8f5fa;color:var(--blue)}.or{background:#ffe9dc;color:#b33c00}
.post{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.post:last-child{border:0}
.av{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;gap:8px}
.chip{font-size:12px;border:1px solid var(--bd);border-radius:14px;padding:2px 10px;cursor:pointer;background:#fff}.chip.on{background:#e8f5fa;border-color:var(--blue);color:var(--blue)}
.ov{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:20}.ov.on{display:grid}.modal{background:#fff;border-radius:10px;padding:18px;width:min(460px,92vw)}
textarea,.in{width:100%;border:1px solid #bbb;border-radius:6px;padding:7px 10px}
.entry{background:#fff;max-width:700px;margin:20px auto;border:1px solid var(--bd);border-radius:12px;padding:20px}
.reply{display:flex;gap:10px;padding:10px;border-radius:8px;margin:8px 0;border:1px solid transparent}.reply.best{background:#f1fbf6;border-color:#bfe6d2}.reply.ai{background:#faf7ff;border-color:#e3d8fb}.reply.flag{background:#fff5f8;border-color:#f3c3d0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d1c1d;color:#fff;border-radius:8px;padding:8px 16px;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:90vw}.toast.show{opacity:1}
.stage{background:#111;border-radius:10px;color:#fff;overflow:hidden}.scene{height:230px;display:grid;place-items:center;background:linear-gradient(160deg,#1c1c1c,#2b2b2b)}
.phone{width:140px;height:210px;border:4px solid #ddd;border-radius:22px;background:#fff;color:#111;padding:10px;font-size:11px;position:relative}
.prow{padding:6px;border-radius:6px;margin:4px 0;background:#f2f2f2;display:flex;justify-content:space-between;align-items:center}.hl{outline:2px solid var(--org);background:#fff1e8}
.tog{width:26px;height:14px;border-radius:8px;background:#bbb;position:relative;transition:.5s}.tog.on{background:#34c759}.tog:after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:.5s}.tog.on:after{left:14px}
.cap{padding:8px 12px;background:#000;font-size:13px;min-height:42px}.bar{height:5px;background:#444;cursor:pointer}.bar>div{height:100%;background:var(--org)}
.pipe{display:flex;gap:6px;margin:8px 0}.pipe div{flex:1;border-radius:6px;padding:6px;font-size:12px;background:#f2f2f2;text-align:center}.pipe .done{background:#e1f5ee;color:var(--grn)}.pipe .cur{background:#fff4d6}
.prog{height:8px;background:#eee;border-radius:5px}.prog>div{height:100%;background:var(--org);border-radius:5px;transition:.2s}
.emb .top,.emb .rail{display:none}.emb .side{width:170px}.emb body,body.emb{height:100vh}
@media(max-width:1000px){.main{grid-template-columns:1fr}.right{display:none}.rail{display:none}.app{flex-direction:column}.side,.emb .side{width:auto;display:flex;align-items:center;gap:2px;padding:6px 10px;overflow-x:auto;overflow-y:hidden;flex:none;white-space:nowrap}.side h4{display:none}.side a{border-radius:14px;padding:4px 12px;gap:6px}}
</style></head><body>
<div class="top"><b id="topname">Nike Member Community</b><div class="s">Search the community</div>
 <span class="me" id="mechip"></span><span>View as:</span><button class="btn s sm" id="roleb" onclick="toggleRole()"></button><button class="btn s sm" onclick="restart()">↺ Restart</button></div>
<div class="app"><nav class="rail"><i>🏠</i><i>💬</i><i>🔔</i><i>🔖</i><i style="background:#fff3">✨</i><i>⋯</i></nav><nav class="side" id="side"></nav>
 <section class="main"><div class="col" id="col"></div><aside class="right" id="right"></aside></section></div>
<div id="entryv" style="display:none;position:fixed;inset:0;z-index:15;overflow:auto;background:#f5f5f5"></div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const QP=new URLSearchParams(location.search),SRC=QP.get('src')||'',ME=SRC==='chatgpt'?'Jordan Lee':'Alex Chen',COL=['#e01e5a','#2eb67d','#ecb22e','#36c5f0','#611f69','#1264a3'];
const QUESTION='My Nike Run Club runs are not syncing to Apple Health. Anyone know why?';
/* ILLUSTRATIVE content for a prototype. Not Nike's real policies or support answers. */
const MEM0=()=>({[ME]:{role:'Member',badge:'Newcomer',pts:SRC==='chatgpt'?0:20},...(SRC==='chatgpt'?{'Sam Rivera':{role:'Member',badge:'Question Master',pts:30,topics:[]}}:{}),'Coach Maya':{role:'Run Club Coach · Nike',badge:'Pace Setter',pts:480,staff:1},'Dev Anand':{role:'Run Club Leader',badge:'Gear Guru',pts:310,topics:['size','fit','pegasus','wide','rain','shoe']},'Tasha Obi':{role:'Marathon runner',badge:'Marathon Mentor',pts:262,topics:['sync','health','app','apple','marathon','vaporfly']},'Leo Park':{role:'Member',badge:'Question Master',pts:44,topics:['rewards','streak']},'Sara Parras':{role:'Member',badge:'Trail Guide',pts:138,topics:['rain','trail']},'PromoBot':{role:'New account · 1 day old',badge:'Newcomer',pts:0,bot:1}});
const KB0=()=>[{t:'Run Club: sync runs to Apple Health',rx:'sync|health|apple',body:'On iPhone open Settings > Privacy & Security > Health > Nike Run Club and turn on Workouts. Update the app, sign out and back in, then wait a few minutes.'},
 {t:'Choosing your size',rx:'size|sizing|fit|wide',body:'Fit varies by model. Compare with a pair you already own and use the size guide for the specific model.'}];
const VID0=()=>({sync:{status:'ready',verified:true,pct:100},size:{status:'none'}});
const VIDEOS={sync:{title:'Fix: runs not syncing to Apple Health',src:['KB: Run Club sync','Accepted answer by Tasha Obi'],steps:[
 {t:'Open Health permissions',cap:'On your iPhone open Settings, Privacy & Security, then Health.',vis:'p0'},
 {t:'Turn on Workouts',cap:'Select Nike Run Club and switch Workouts on.',vis:'p1'},
 {t:'Update and sign in again',cap:'Update the app in the App Store, then sign out and sign back in.',vis:'login'},
 {t:'Confirm in Apple Health',cap:'Wait a few minutes. Your run should now appear in Health.',vis:'done'}]},
 size:{title:'How to find your fit at home',src:['KB: Choosing your size','Top-voted reply by Dev Anand'],steps:[
 {t:'Pick a reference pair',cap:'Choose a shoe you already own and like.',vis:'shoe'},{t:'Measure your foot',cap:'Stand on paper in the evening and mark heel and toe.',vis:'measure'},{t:'Compare to the size guide',cap:'Match the length to the model’s size guide, and note wide-fit notes from members.',vis:'guide'}]}};
const SEED=()=>({view:'entry',role:'member',filter:'All',fmt:'Text',nid:50,src:'ChatGPT',open:null,conn:{},mem:MEM0(),kb:KB0(),vid:VID0(),log:[],hv:{},exp:{},tf:'All',notes:[{t:'Welcome! Reply or ask a question to earn your first badge',r:0}],sum:{},pv:{},cat:'All',tag:'',sort:'Latest',ch:'lounge',chlog:CH0(),att:0,incoming:['Leo Park'],dms:{},chat:null,huddle:null,sent:{},drafts:{},routed:{},voted:{},
 posts:[
 {id:1,type:'q',u:SRC==='chatgpt'?'Sam Rivera':'Alex Chen',t:'My Nike Run Club runs are not syncing to Apple Health. Anyone know why?',b:'Runs recorded yesterday do not appear in Health.',topic:'sync',asks:214,age:'just now',solved:false,poll:{q:'What fixed it for you?',o:[{t:'Health permissions',v:41},{t:'Update and sign in again',v:28},{t:'Just waited a few minutes',v:9}]},replies:[
  {id:1,u:'Tasha Obi',role:'member',up:3,b:'Check Health permissions: Settings > Privacy & Security > Health > Nike Run Club and make sure Workouts is on.'},
  {id:2,u:'Dev Anand',role:'member',up:1,b:'Also update the app and sign out and in again. A delayed sync can take a few minutes.'}]},
 {id:2,type:'q',u:'Leo Park',t:'Do Pegasus run true to size for wide feet?',b:'Thinking of a half size up.',topic:'size',asks:163,age:'2d',solved:false,replies:[
  {id:3,u:'Dev Anand',role:'member',b:'I went half a size up for the wider midfoot. Try in the evening when feet are largest.'},
  {id:4,u:'AI assistant',role:'ai',b:'All models run exactly true to size, so you never need to size up.',flag:{why:'Contradicts size guidance: fit varies by model',state:'pending'}}]},
 {id:3,type:'q',u:'Leo Park',t:'How do I redeem Run Club streak rewards?',b:'I hit a 30-day streak but see no reward.',topic:'rewards',asks:120,age:'1d',solved:false,replies:[]},
 {id:9,type:'q',u:'PromoBot',t:'What are the top 10 best running shoes in 2026? Please provide a comprehensive overview.',b:'Please provide a comprehensive overview of the best shoes for every runner.',topic:'general',asks:3,age:'1h',aiPost:{why:'Listicle and prompt-style wording from a brand-new account',state:'pending'},replies:[]},
 {id:4,type:'q',u:'Sara Parras',t:'Can I return shoes bought with a gift receipt?',b:'Received a pair as a gift.',topic:'returns',asks:88,age:'3d',solved:false,replies:[]},
 {id:5,type:'q',u:'Tasha Obi',t:'Are trail shoes OK for wet road runs in the rain?',b:'Training through autumn.',topic:'rain',asks:57,age:'4d',solved:false,replies:[]},
 {id:6,type:'idea',u:'Tasha Obi',t:'Voice alerts for heart-rate zones during runs',b:'Hard to look at the screen mid-run.',topic:'app',votes:99,status:'Under review',cat:'App',age:'1w',replies:[]},
 {id:7,type:'idea',u:'Dev Anand',t:'Wider toe box option for race shoes',b:'Many of us size up just for width.',topic:'size',votes:64,status:'Under review',cat:'Product',age:'2w',replies:[]},
 {id:8,type:'idea',u:'Sara Parras',t:'Show streak rewards inside the run summary',b:'Make rewards visible after each run.',topic:'rewards',votes:51,status:'Shipped',cat:'App',age:'2mo',replies:[]}]});
const KEY='nk5'+(SRC?'-'+SRC:'');
let S=JSON.parse(localStorage.getItem(KEY)||'null')||SEED();const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const staff=()=>S.role==='staff',pending=x=>x.flag&&x.flag.state==='pending';
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2800)}
const lvl=p=>p>=300?'Pace Setter':p>=100?'Gear Guru':p>=40?'Helper':'Newcomer';
function badge(n){const m=S.mem[n];if(!m)return'';return n===ME?lvl(m.pts):m.badge}
function award(n,pts,why){if(!S.mem[n])S.mem[n]={role:'Member',badge:'Newcomer',pts:0};const b4=tlOf(S.mem[n].pts);S.mem[n].pts+=pts;S.log.unshift({n,pts,why});S.log=S.log.slice(0,8);if(n===ME){toast('+'+pts+' points: '+why);note('+'+pts+' · '+why);const a=tlOf(S.mem[n].pts);if(CFG.f.tl&&a>b4){note('🛡 You reached trust level '+a+': '+TLN[a]);toast('Trust level '+a+' unlocked')}checkBadges()}}
function board(){return Object.keys(S.mem).filter(n=>!S.mem[n].bot).map(n=>({n,pts:S.mem[n].pts,role:S.mem[n].role,badge:badge(n)})).sort((a,b)=>b.pts-a.pts)}
const rank=()=>board().findIndex(x=>x.n===ME)+1;
const av=n=>`<div class="av" style="background:${COL[n.length%6]}">${n.split(/[ .]/).map(x=>x[0]).join('').slice(0,2)}</div>`;
const who=n=>{const m=S.mem[n]||{};return `<b>${esc(n)}</b> ${m.staff?'<span class="tag or">Nike staff</span>':''}<span class="tag g">${badge(n)}</span>${CFG.f.tl&&!m.bot?`<span class="tag b">TL${tlOf(m.pts||0)}</span>`:''}<span class="meta">${m.pts||0} pts</span>`};
function toggleRole(){S.role=staff()?'member':'staff';if(!staff()&&['admin','studio'].includes(S.view))S.view='home';save();render()}
function restart(){if(confirm('Reset the demo?')){localStorage.removeItem(KEY);S=SEED();render()}}
function go(v,o){S.view=v;if(o!==undefined)S.open=o;save();render()}
function match(t){t=(t||'').toLowerCase();return Object.keys(S.mem).filter(n=>n!==ME&&!S.mem[n].staff).map(n=>({n,s:(S.mem[n].topics||[]).filter(x=>t.includes(x)).length})).filter(x=>x.s).sort((a,b)=>b.s-a.s).map(x=>x.n)}
const kbFor=t=>S.kb.filter(k=>new RegExp(k.rx).test(t.toLowerCase()));
const verified=p=>p.replies.some(r=>(r.role==='staff'||r.val||r.best||(r.up||0)>=3)&&!pending(r)&&r.role!=='ai')||kbFor(p.t+' '+p.topic).length>0;
const EMBED=/[?&]embed=1/.test(location.search);if(EMBED)document.body.classList.add('emb');
function loopN(){return CFG.loop.on?Object.keys(S.lp||{}).filter(k=>S.drafts[k]!=='published').length:0}
function autoLoop(){if(!CFG.loop.on)return;S.lp=S.lp||{};let ch=0;if(!S.mem['Auto-detected'])S.mem['Auto-detected']={role:'Member',badge:'Community Bot',pts:0,bot:1};S.posts.filter(p=>p.type==='q'&&!p.aiPost&&p.asks>=CFG.loop.n&&!verified(p)&&S.drafts[p.id]!=='published').forEach(p=>{if(S.lp[p.id])return;S.lp[p.id]={at:Date.now(),n:p.asks};ch=1;
  if(CFG.loop.autoKB&&!S.drafts[p.id])S.drafts[p.id]='draft';
  if(CFG.loop.autoFb){S.posts.push({id:S.nid++,type:'idea',u:'Auto-detected',t:'Fix needed: '+p.t,b:'Asked by '+p.asks+' members. Detected as a repeated question and added to product feedback automatically.',topic:p.topic,votes:p.asks,status:'Under review',cat:'App',auto:1,src:p.id,replies:[]});S.routed[p.id]=S.routed[p.id]}}
 );if(ch)save()}
function render(){autoLoop();if(EMBED&&S.view==='entry'){S.view=QP.get('view')||'home';if(QP.get('open'))S.open=+QP.get('open')}
 applyCfg();$('topname').textContent=CFG.name;if(!S.bd){S.bd={};BADGES.forEach(b=>{if(b.t())S.bd[b.k]=1})}
 $('roleb').textContent=staff()?'Nike staff (admin)':'Member';
 const m=S.mem[ME];$('mechip').textContent=`🏅 #${rank()} · ${m.pts} pts · ${lvl(m.pts)}`;
 $('entryv').style.display=S.view==='entry'?'block':'none';if(S.view==='entry'){$('entryv').innerHTML=entry();return}
 const nav=[['home','Home'],['hot','Hot discussions'],CFG.f.chat?['chat','Chat channels']:0,CFG.f.connections?['network','Connections']:0,CFG.f.ideas?['ideas','Ideas & feedback']:0,CFG.f.kb?['kb','Knowledge base']:0,CFG.f.board?['board',CFG.f.badges?'Leaderboard & badges':'Leaderboard']:0].filter(Boolean).concat(staff()?[['admin','Admin insights'+(loopN()?' ('+loopN()+')':'')],['studio','Video studio']]:[]);
 $('side').innerHTML='<h4>Community</h4>'+nav.map(([k,l])=>`<a class="${S.view===k||(S.view==='thread'&&k==='home')?'on':''}" onclick="go('${k}')"># ${l}</a>`).join('')+'<h4>Connections</h4>'+(Object.keys(S.conn).map(n=>`<a onclick="msg('${n}')">${n} <span>${S.conn[n]==='pending'?'⏳':'●'}</span></a>`).join('')||'<a style="opacity:.6">None yet</a>');
 $('col').innerHTML=({home,hot,chat:chatV,network,ideas,kb,board:boardV,admin,studio,thread})[S.view]();$('right').innerHTML=rightRail();paintVideo();if(parent!==window)parent.postMessage({type:'nk',rank:rank(),pts:m.pts,role:S.role,lvl:lvl(m.pts)},'*')}
addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.type==='nk-role'){S.role=d.role;if(!staff()&&['admin','studio'].includes(S.view))S.view='home';save();render()}if(d.type==='nk-cfg'){CFG=loadCfg();render()}if(d.type==='nk-go'){if(d.fmt)S.fmt=d.fmt;S.view=d.view;if(d.open!==undefined)S.open=d.open;save();render()}});
/* ---------- entry ---------- */
function entry(){return `<div class="entry"><div class="meta">Step 1 · A runner asks outside the community</div>
 <div style="display:flex;gap:6px;margin:8px 0">${['ChatGPT','Google','Help Center'].map(x=>`<span class="chip ${S.src===x?'on':''}" onclick="S.src='${x}';render()">${x}</span>`).join('')}</div>
 <div style="background:#f4f4f4;border-radius:12px;padding:10px 14px;margin-left:auto;max-width:85%">${esc(QUESTION)}</div>
 <p><b>Common reasons Nike Run Club runs do not appear in Apple Health:</b></p>
 <div class="card"><b>1. Permissions</b><div class="meta">Workouts access may be off.</div>✅ Fix: enable Workouts for the app in Health settings.</div>
 <div class="card"><b>2. App version or sign-in</b><div class="meta">An old build or stale session can block sync.</div>✅ Fix: update, sign out, sign in.</div>
 <div class="card"><b>3. Sync delay</b><div class="meta">Data can take a few minutes.</div>✅ Fix: wait, then reopen Health.</div>
 <p><b>Get help from the <a href="#" onclick="go('home');return false" style="color:var(--blue)">Nike Member Community</a>: peers, coaches and a step-by-step video.</b></p>
 <button class="btn o" onclick="go('home')">Open the community →</button>
 <div class="meta" style="margin-top:10px">Illustrative prototype content for a Nike use case. Not official Nike policy or support answers.</div></div>`}
/* ---------- video ---------- */
let P={topic:null,step:0,t:0,playing:false,speed:1,cc:true,done:false};let tick=null;
function scene(v){const ph=c=>`<div class="phone">${c}</div>`,row=(l,h,t)=>`<div class="prow ${h?'hl':''}"><span>${l}</span>${t===undefined?'':`<span class="tog ${t?'on':''}"></span>`}</div>`;
 if(v==='p0')return ph('<b>Health</b>'+row('Data Access',1)+row('Sources')+row('Devices'));
 if(v==='p1')return ph('<b>Nike Run Club</b>'+row('Workouts',1,P.t>1.5)+row('Heart Rate',0,1)+row('Steps',0,0));
 if(v==='login')return ph('<b>Nike Run Club</b>'+row('Update available ⬇',1)+row('Sign out')+row('Sign in'));
 if(v==='done')return ph('<b>Health · Workouts</b>'+'<div class="prow hl"><span>🏃 5.2 km run</span><span>✓</span></div>'+row('Synced just now'));
 if(v==='shoe')return '<div style="font-size:90px">👟</div>';if(v==='measure')return '<div style="font-size:70px">📏🦶</div>';if(v==='guide')return '<div style="background:#fff;color:#111;padding:12px;border-radius:8px;font-size:12px"><b>Size guide</b><div>26.0 cm → US 8</div><div class="hl" style="padding:2px">26.5 cm → US 8.5</div><div>27.0 cm → US 9</div></div>';return''}
function vplayer(topic){const v=VIDEOS[topic],st=S.vid[topic]||{status:'none'};
 if(!v)return '<div class="meta">No video for this topic yet.</div>';
 if(st.status==='none')return `<div class="card" style="background:#fafafa">🎬 No troubleshooting video yet for this topic.<br><button class="btn o sm" style="margin-top:6px" onclick="startRender('${topic}')">${staff()?'Render video':'Request a video'}</button></div>`;
 if(st.status==='rendering')return `<div class="card">🎬 Rendering “${v.title}”…<div class="prog"><div style="width:${st.pct}%"></div></div><div class="meta">${stageName(st.pct)} · ${st.pct}%</div></div>`;

/* ---------- AI detection ---------- */
function detectAI(t,role){const T=(t||'').toLowerCase(),R=[];let s=0;const c=(re,w,m)=>{if(re.test(T)){s+=w;R.push(m)}};
 if(role==='ai'){return{score:100,R:['Written by the AI assistant (system-labelled)']}}
 if(/\(ai-assisted\)/.test(T)){return{score:100,R:['Author disclosed AI help']}}
 c(/certainly!|as an ai|i hope this helps|delve|it is important to note|in conclusion|comprehensive overview|navigate the/,35,'Stock AI phrasing');
 c(/\btop \d+\b|ultimate guide|best of \d/,15,'Listicle / SEO-style wording');
 c(/please provide|kindly provide/,15,'Instruction-style, prompt-like wording');
 c(/all models|always|never|exactly|guarantee/,25,'Absolute claims that conflict with fit guidance');
 if(T.length>120&&!/\b(i|i'm|i've|don't|can't|it's|my|me)\b/.test(T)){s+=15;R.push('Long and formal with no first-person voice')}
 return{score:Math.min(98,s),R}}
function verdict(n){return n>=60?['Likely AI-generated','r']:n>=30?['Possibly AI-assisted','y']:['Likely human','g']}
function checkAI(pid,rid){const p=S.posts.find(x=>x.id===pid),r=rid?rep(pid,rid):null,txt=r?r.b:p.t+' '+p.b,d=detectAI(txt,r&&r.role),v=verdict(d.score),who_=r?r.u:p.u;
 $('modal').innerHTML=`<h3 style="margin-top:0">🔍 AI check</h3><div class="meta">${r?'Reply':'Question'} by ${esc(who_)}</div><div style="background:#f6f6f6;border-radius:6px;padding:8px;margin:8px 0;font-size:13px">${esc(txt)}</div>
 <div class="row"><b>${v[0]}</b><span class="tag ${v[1]}">${d.score}% AI likelihood</span></div><div class="prog"><div style="width:${d.score}%;background:${d.score>=60?'#b3123a':d.score>=30?'#ecb22e':'#2eb67d'}"></div></div>
 <div style="margin-top:8px"><b style="font-size:12px">Signals</b>${d.R.map(x=>`<div class="meta">• ${x}</div>`).join('')||'<div class="meta">• No AI-style signals found</div>'}</div>
 ${(r&&r.flag)||(!r&&p.aiPost)?`<div class="meta" style="margin-top:6px">Moderation status: <b>${(r?r.flag.state:p.aiPost.state)}</b></div>`:''}
 <div class="meta" style="margin-top:8px">Heuristic estimate for the prototype, not proof. Staff make the final call.</div><div style="text-align:right;margin-top:8px"><button class="btn" onclick="$('ov').classList.remove('on')">Close</button></div>`;$('ov').classList.add('on')}

function qsFor(){const F=S.filter,L=S.posts.filter(p=>visQ(p)&&(F==='All'||(F==='Unanswered'&&!(p.solved||verified(p)))||(F==='Solved'&&(p.solved||verified(p)))||(F==='AI-posted'&&p.aiPost)||(F==='Has AI answers'&&p.replies.some(r=>r.role==='ai'||r.flag)))&&(!CFG.f.cats||S.cat==='All'||catKey(p)===S.cat)&&(!S.tag||tagsOf(p).includes(S.tag)));return S.sort==='Top'?[...L].sort((a,b)=>b.asks-a.asks):L}

  ${!pend&&t!=='removed'?`<div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn s sm" onclick="checkAI(${p.id},${r.id})">🔍 Check AI</button><button class="btn s sm" ${voted||r.u===ME||r.role==='ai'?'disabled':''} onclick="helpful(${p.id},${r.id})">👍 Helpful ${r.up||0}</button>${staff()&&r.role!=='ai'&&t!=='val'?`<button class="btn sm" onclick="validate(${p.id},${r.id})">✓ Validate</button>`:''}${CFG.f.flags&&r.role!=='ai'&&r.u!==ME&&!staff()?`<button class="btn s sm" onclick="report(${p.id},${r.id})">🚩 Flag</button>`:''}</div>`:''}</div></div>`}).join('')||'<div class="meta">Nothing in this filter yet.</div>')}
function rep(pid,rid){return S.posts.find(x=>x.id===pid).replies.find(x=>x.id===rid)}
function helpful(pid,rid){const r=rep(pid,rid),k=pid+'-'+rid;if(S.hv[k])return;S.hv[k]=1;r.up=(r.up||0)+1;award(r.u,1,'reply marked helpful');if(r.up===3){award(r.u,5,'answer became community-validated');toast('Now community-validated')}save();render()}
function validate(pid,rid){const r=rep(pid,rid);r.val=true;award(r.u,5,'answer validated by Nike');save();render();toast('Validated. It now counts as a verified answer')}
function flagQueue(){const q=[],qq=S.posts.filter(p=>p.aiPost&&p.aiPost.state==='pending');S.posts.forEach(p=>p.replies.forEach(r=>{if(pending(r))q.push([p,r])}));
 return `<div class="card" style="border-color:#f3c3d0"><b>🚩 AI-flagged answers</b> <span class="meta">${q.length+qq.length} awaiting review</span>${qq.map(p=>`<div class="row"><div><b>🤖 Question: ${esc(p.t)}</b><div class="meta">${esc(p.u)} · ${p.aiPost.why}</div></div><div style="white-space:nowrap"><button class="btn sm" onclick="modQ(${p.id},'verified')">Human-verified</button> <button class="btn sm bad" onclick="modQ(${p.id},'removed')">Remove</button></div></div>`).join('')}${q.map(([p,r])=>`<div class="row"><div><b>${esc(p.t)}</b><div class="meta">${esc(r.u)}: “${esc(r.b)}”<br>${r.flag.why}</div></div><div style="white-space:nowrap"><button class="btn sm" onclick="mod(${p.id},${r.id},'approved')">Approve</button> <button class="btn sm bad" onclick="mod(${p.id},${r.id},'removed')">Remove</button></div></div>`).join('')||'<div class="meta">Queue is clear.</div>'}</div>`}
/* ---------- connections ---------- */
const REPLIES={'Tasha Obi':'Start with Health > Data Access > Nike Run Club > Workouts. Want to hop on a huddle?','Dev Anand':'Happy to help. Which phone and app version are you on?','Leo Park':'Thanks for connecting. I am new here too.','Sara Parras':'Hi! Ask me anything about trail runs.','Coach Maya':'Hi, a coach will follow up here.'};
function msg(n){if(S.conn[n]!=='connected'){toast(S.conn[n]==='pending'?'Waiting for them to accept':'Add them as a connection first');return}S.chat=n;go('network')}
function huddle(n){if(S.conn[n]!=='connected'){toast('Add them as a connection first');return}S.huddle=n;S.chat=n;save();go('network');toast('Huddle started with '+n)}
function sendDM(){const v=$('dm').value.trim(),n=S.chat;if(!v)return;(S.dms[n]=S.dms[n]||[]).push({me:1,t:v});save();render();setTimeout(()=>{S.dms[n].push({me:0,t:REPLIES[n]||'Thanks for reaching out.'});save();if(S.view==='network')render()},1200)}
function acceptReq(n){S.incoming=S.incoming.filter(x=>x!==n);S.conn[n]='connected';award(ME,2,'grew your network');save();render()}
function declineReq(n){S.incoming=S.incoming.filter(x=>x!==n);save();render()}
function network(){const conn=Object.keys(S.conn).filter(n=>S.conn[n]==='connected'),pend=Object.keys(S.conn).filter(n=>S.conn[n]==='pending'),sug=Object.keys(S.mem).filter(n=>n!==ME&&!S.mem[n].staff&&!S.conn[n]&&!S.incoming.includes(n));
 return `<h3>👥 Connections</h3>
 ${S.huddle?`<div class="card" style="background:#1d1c1d;color:#fff">🎧 In huddle with <b>${S.huddle}</b> <button class="btn bad sm" style="float:right" onclick="S.huddle=null;save();render()">Leave</button></div>`:''}
 ${S.incoming.length?`<div class="card"><b>Requests</b>${S.incoming.map(n=>`<div class="row"><div>${who(n)}<div class="meta">wants to connect</div></div><div><button class="btn sm" onclick="acceptReq('${n}')">Accept</button> <button class="btn s sm" onclick="declineReq('${n}')">Decline</button></div></div>`).join('')}</div>`:''}
 <div class="card"><b>Your connections (${conn.length})</b>${conn.map(n=>`<div class="row"><div>${who(n)}<div class="meta">${S.mem[n].role}</div></div><div><button class="btn s sm" onclick="msg('${n}')">💬 Message</button> <button class="btn s sm" onclick="huddle('${n}')">🎧 Huddle</button></div></div>`).join('')||'<div class="meta">None yet. Add someone below, or from Expert Match.</div>'}${pend.length?`<div class="meta" style="margin-top:6px">Pending: ${pend.join(', ')}</div>`:''}</div>
 ${S.chat?`<div class="card"><b>Chat with ${S.chat}</b><div style="margin:8px 0;min-height:60px">${(S.dms[S.chat]||[]).map(m=>`<div style="text-align:${m.me?'right':'left'}"><span style="display:inline-block;background:${m.me?'#e8f5fa':'#f2f2f2'};border-radius:10px;padding:4px 10px;margin:2px 0">${esc(m.t)}</span></div>`).join('')||'<div class="meta">Say hello.</div>'}</div><div style="display:flex;gap:6px"><input class="in" id="dm" placeholder="Message" onkeydown="if(event.key==='Enter')sendDM()"><button class="btn" onclick="sendDM()">Send</button></div></div>`:''}
 <div class="card"><b>Suggested for you</b>${sug.map(n=>`<div class="row"><div>${who(n)}<div class="meta">${S.mem[n].role}</div></div><button class="btn s sm" onclick="openConn('${n}')">👤 Add connection</button></div>`).join('')||'<div class="meta">You know everyone.</div>'}</div>`}
/* ---------- leaderboard + rail ---------- */
function boardV(){const all=board(),top=all.slice(0,3),sel=S.prof?all.find(x=>x.n===S.prof):null;
 return `<h3>🏆 Community leaderboard</h3><div style="background:#f4e1f5;border-radius:10px;padding:14px;display:flex;gap:14px;justify-content:center;align-items:flex-end">${[top[1],top[0],top[2]].map((x,i)=>`<div style="text-align:center;cursor:pointer" onclick="S.prof='${x.n}';render()"><div class="av" style="background:${COL[x.n.length%6]};width:${i===1?68:54}px;height:${i===1?68:54}px;margin:auto;font-size:18px">${x.n.split(/[ .]/).map(y=>y[0]).join('').slice(0,2)}</div><div style="background:#fff;border-radius:8px;padding:4px 8px;margin-top:6px;font-size:12px"><b>${x.n}</b><div class="meta">${x.pts} pts</div></div></div>`).join('')}</div>
 <div class="card" style="margin-top:12px">${all.map((x,i)=>`<div class="row" style="cursor:pointer;${x.n===ME?'font-weight:700;color:var(--blue)':''}" onclick="S.prof='${x.n}';render()"><span>${i+1}. ${x.n}<div class="meta">${x.role}</div><span class="tag g">${x.badge}</span></span><b>${x.pts} pts</b></div>`).join('')}<div class="meta">Points: +10 helping resolve, +5 resolving, +3 feedback, +2 posting, +1 idea votes. AI answers and flagged posts earn nothing.</div></div>
 ${CFG.f.badges?badgeGrid():''}${sel?`<div class="card">${who(sel.n)}<div class="meta">${sel.role} · Active</div><div style="margin-top:6px"><button class="btn s sm" onclick="msg('${sel.n}')">Message</button> <button class="btn s sm" onclick="huddle('${sel.n}')">🎧 Huddle</button> ${S.conn[sel.n]||sel.n===ME?'':`<button class="btn sm" onclick="openConn('${sel.n}')">Add connection</button>`}</div></div>`:''}`}
function rightRail(){const m=S.mem[ME],b=board().slice(0,4),next=m.pts>=300?null:m.pts>=100?300:m.pts>=40?100:40;
 return `<div class="card"><b>🏅 Your standing</b><div style="font-size:22px">#${rank()} · ${m.pts} pts</div><span class="tag g">${lvl(m.pts)}</span>${next?`<div class="meta">${next-m.pts} pts to the next badge</div><div class="prog"><div style="width:${Math.min(100,m.pts/next*100)}%"></div></div>`:'<div class="meta">Top badge reached</div>'}</div>
 ${tlCard()}${notesCard()}<div class="card"><b>Leaderboard</b>${b.map((x,i)=>`<div class="row" style="${x.n===ME?'font-weight:700;color:var(--blue)':''}"><span>${i+1}. ${x.n}<div><span class="tag g">${x.badge}</span></div></span><b>${x.pts}</b></div>`).join('')}<a class="meta" style="cursor:pointer" onclick="go('board')">View full leaderboard</a></div>
 <div class="card"><b>Trust labels</b><div class="meta"><span class="tag g">✓ Validated by Nike</span> staff-checked<br><span class="tag g">✓ Community-validated</span> 3+ helpful votes<br><span class="tag ai">✨ AI-written</span> disclosed AI, no points<br><span class="tag r">🚩 AI-flagged</span> held for review</div></div><div class="card"><b>Recent activity</b>${S.log.map(l=>`<div class="meta">+${l.pts} ${l.n===ME?'You':l.n} · ${l.why}</div>`).join('')||'<div class="meta">Post, reply or vote to earn points.</div>'}</div>`}
render();
</script></body></html>
